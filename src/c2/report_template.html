<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C2 Results Viewer</title>
<!-- Template for `python scripts/c2.py report` (src/c2/report.py). Data comes from data/*.js next to this file. -->
<style>
:root {
  --bg: #f7f6f3; --surface: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e8e7e1; --axis: #c3c2b7; --line: #e1e0d9; --chip: #f0efec;
  --warn-bg: #fdecea; --warn-ink: #b02a2a; --ok-ink: #13744f; --ok-bg: #e3f5ec;
  --accent: #2a78d6;
  --c-e: #eb6834; --c-w: #2a78d6; --c-s: #1baf7a; --c-x: #c98a00; --c-p: #e87ba4; --c-r: #6250d6;
  --m-pythia410m: #2a78d6; --m-qwen25_05b: #eb6834;
  --reg-prefix: #898781; --reg-slot: #eb6834; --reg-buffer: #1baf7a; --reg-q: #2a78d6; --reg-after: #c3c2b7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --surface: #1c1c1a; --ink: #f2f1ec; --ink2: #c3c2b7; --muted: #8f8d86;
    --grid: #2c2b28; --axis: #4a4944; --line: #33322f; --chip: #2a2926;
    --warn-bg: #3a1d1b; --warn-ink: #ff9b91; --ok-ink: #6fd8a8; --ok-bg: #16352a;
    --accent: #5b9ae6;
    --c-e: #f08a5e; --c-w: #5b9ae6; --c-s: #3fc795; --c-x: #f0b52e; --c-p: #ef9cbd; --c-r: #8f80ea;
    --m-pythia410m: #5b9ae6; --m-qwen25_05b: #f08a5e;
    --reg-prefix: #77756f; --reg-slot: #f08a5e; --reg-buffer: #3fc795; --reg-q: #5b9ae6; --reg-after: #4a4944;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --surface: #1c1c1a; --ink: #f2f1ec; --ink2: #c3c2b7; --muted: #8f8d86;
  --grid: #2c2b28; --axis: #4a4944; --line: #33322f; --chip: #2a2926;
  --warn-bg: #3a1d1b; --warn-ink: #ff9b91; --ok-ink: #6fd8a8; --ok-bg: #16352a;
  --accent: #5b9ae6;
  --c-e: #f08a5e; --c-w: #5b9ae6; --c-s: #3fc795; --c-x: #f0b52e; --c-p: #ef9cbd; --c-r: #8f80ea;
  --m-pythia410m: #5b9ae6; --m-qwen25_05b: #f08a5e;
  --reg-prefix: #77756f; --reg-slot: #f08a5e; --reg-buffer: #3fc795; --reg-q: #5b9ae6; --reg-after: #4a4944;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 -apple-system, "Helvetica Neue", Arial, sans-serif; }
header { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
.top { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 14px 0 6px; }
.top h1 { font-size: 18px; margin: 0; }
.top .sub { color: var(--muted); font-size: 12px; }
.top .spacer { flex: 1; }
nav { display: flex; gap: 2px; overflow-x: auto; }
nav a { padding: 8px 12px; color: var(--ink2); text-decoration: none; border-bottom: 2px solid transparent; white-space: nowrap; }
nav a.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
main { padding: 20px 0 60px; }
h2 { font-size: 17px; margin: 28px 0 6px; }
h2:first-child { margin-top: 0; }
h3 { font-size: 14px; margin: 18px 0 6px; }
p.lead { color: var(--ink2); margin: 0 0 14px; max-width: 820px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin: 12px 0; }
.grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .k { color: var(--ink2); font-size: 12px; }
.tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 2px 0; }
.tile .n { color: var(--muted); font-size: 12px; }
.banner { border-radius: 8px; padding: 10px 14px; margin: 0 0 14px; font-weight: 600; background: var(--warn-bg); color: var(--warn-ink); }
.banner small { display: block; font-weight: 400; color: var(--ink2); }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 8px; border-radius: 99px; font-weight: 600; }
.status.ok { background: var(--ok-bg); color: var(--ok-ink); }
.status.bad { background: var(--warn-bg); color: var(--warn-ink); }
.status.none { background: var(--chip); color: var(--ink2); }
.controls { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 8px 0 12px; }
.controls label { font-size: 12px; color: var(--ink2); display: inline-flex; gap: 6px; align-items: center; }
select, input[type=search] { font: inherit; font-size: 13px; padding: 4px 8px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); }
input[type=search] { min-width: 200px; }
button { font: inherit; font-size: 13px; padding: 4px 10px; border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); color: var(--ink); cursor: pointer; }
button.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--ink2); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; max-width: 100%; }
main, .card, .two > * { min-width: 0; }
.chip { display: inline-block; padding: 1px 5px; margin: 1px 2px 1px 0; border-radius: 4px; background: var(--chip); font: 12px/1.6 ui-monospace, Menlo, monospace; white-space: pre; }
.chip.frag { background: color-mix(in srgb, var(--c-e) 22%, var(--surface)); }
.strip .chip { color: #fff; }
.strip .chip.prefix { background: var(--reg-prefix); }
.strip .chip.slot { background: var(--reg-slot); }
.strip .chip.buffer { background: var(--reg-buffer); }
.strip .chip.q { background: var(--reg-q); }
.strip .chip.after { background: var(--reg-after); color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--ink2); margin: 6px 0; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.legend i.line { height: 2px; border-radius: 1px; vertical-align: 3px; width: 14px; }
pre.txt { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow-x: auto; font: 12px/1.45 ui-monospace, Menlo, monospace; margin: 8px 0; }
details > summary { cursor: pointer; color: var(--ink2); margin: 8px 0; }
.two { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
.list { max-height: 640px; overflow-y: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.list .it { padding: 6px 10px; border-bottom: 1px solid var(--line); cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.list .it:hover { background: var(--chip); }
.list .it.on { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.list .it .em { font-size: 18px; width: 28px; }
.list .it .meta { color: var(--muted); font-size: 12px; }
.rawtext { white-space: pre-wrap; font-size: 13px; color: var(--ink2); }
.rawtext mark { background: color-mix(in srgb, var(--c-e) 30%, transparent); color: var(--ink); padding: 0 2px; border-radius: 3px; }
.pager { display: flex; gap: 8px; align-items: center; margin: 8px 0; font-size: 12px; color: var(--ink2); }
.steps { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.step .num { color: var(--muted); font-size: 12px; font-weight: 600; }
.step h3 { margin: 2px 0 6px; }
.step p { margin: 4px 0; color: var(--ink2); font-size: 13px; }
.step a { color: var(--accent); font-size: 13px; }
dl.gloss { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; margin: 0; }
dl.gloss dt { font-weight: 600; }
dl.gloss dd { margin: 0; color: var(--ink2); }
.gallery { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.gallery figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.gallery img { width: 100%; height: auto; border-radius: 6px; background: #fcfcfb; }
.gallery figcaption { font-size: 12px; color: var(--ink2); margin-top: 6px; }
svg text { fill: var(--ink2); font-size: 11px; }
svg .axis { stroke: var(--axis); }
svg .gridl { stroke: var(--grid); }
#tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--surface); font-size: 12px; padding: 6px 9px; border-radius: 6px; white-space: pre; z-index: 50; display: none; max-width: 420px; line-height: 1.45; }
.muted { color: var(--muted); }
.empty { color: var(--ink2); background: var(--surface); border: 1px dashed var(--axis); border-radius: 10px; padding: 18px; }
code { font: 12px ui-monospace, Menlo, monospace; background: var(--chip); padding: 1px 4px; border-radius: 4px; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } dl.gloss { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <h1>C2 results viewer</h1>
      <span class="sub" id="gen"></span>
      <span class="spacer"></span>
      <button id="theme" title="Switch light / dark">Theme</button>
    </div>
    <nav id="tabs"></nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="tip"></div>
<script>window.C2_RUN = {};</script>
<script src="data/base.js" charset="utf-8"></script>
<script>
"use strict";
const D = window.C2;
const CONDS = ["e", "w", "s", "x", "p", "r"];
const MEASURES = [
  ["d_es_far", "Δ_es  emoji − rare characters (far)"],
  ["d_ew_far", "Δ_ew  emoji − English word (far)"],
  ["d_ex_far", "Δ_ex  emoji − hex string (far)"],
  ["d_es_near", "Δ_es  emoji − rare characters (near)"],
  ["d_ew_near", "Δ_ew  emoji − English word (near)"],
  ["d_ex_near", "Δ_ex  emoji − hex string (near)"],
  ["d_er_far_per_token", "Δ_er  per token, emoji − ordinary word (far)"],
  ["d_er_near_per_token", "Δ_er  per token, emoji − ordinary word (near)"],
  ["d_pr_far", "Δ_pr  punctuation − ordinary word (far, positive control)"],
  ["d_pr_near", "Δ_pr  punctuation − ordinary word (near)"],
];
const MLABEL = Object.fromEntries(MEASURES);
const TABS = [["overview", "Overview"], ["audit", "1 · Audit"], ["controls", "2 · Controls"], ["probes", "3 · Probes"],
              ["runs", "4 · Runs"], ["tests", "5 · Tests"], ["figures", "6 · Figures"]];

// ---------- helpers ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const sgn = (v, d = 4) => (isNaN(v) ? "–" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d));
const pct = v => (100 * v).toFixed(0) + "%";
function f32(b64) {
  const bin = atob(b64), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Float32Array(u8.buffer);
}
function meanSE(vals) {
  const v = vals.filter(x => !isNaN(x)), n = v.length;
  if (!n) return {m: NaN, se: NaN, n: 0};
  const m = v.reduce((a, b) => a + b, 0) / n;
  const sd = n > 1 ? Math.sqrt(v.reduce((a, b) => a + (b - m) ** 2, 0) / (n - 1)) : 0;
  return {m, se: n > 1 ? sd / Math.sqrt(n) : 0, n};
}
function niceTicks(lo, hi, count = 5) {
  if (lo === hi) { lo -= 1; hi += 1; }
  const step0 = (hi - lo) / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= step0);
  const out = [], end = Math.ceil(hi / step - 1e-9) * step;
  for (let t = Math.floor(lo / step + 1e-9) * step; t <= end + step * 1e-6; t += step) out.push(+t.toFixed(10));
  return out;
}
function tickFmt(t) { return Math.abs(t) >= 1 || t === 0 ? String(+t.toFixed(2)) : String(+t.toPrecision(2)); }
function pieces(str) {
  return (str || "").split(" | ").filter(Boolean).map(p => `<span class="chip${p.includes("‹") ? " frag" : ""}">${esc(p)}</span>`).join("");
}
function chipList(arr) { return arr.map(p => `<span class="chip${p.includes("‹") ? " frag" : ""}">${esc(p)}</span>`).join(""); }
function opt(v, label, cur) { return `<option value="${esc(v)}"${String(v) === String(cur) ? " selected" : ""}>${esc(label)}</option>`; }
function uniq(a) { return [...new Set(a)]; }
function emptyBox(msg) { return `<div class="empty">${msg}</div>`; }
function txtBlock(title, t, open = false) {
  return t ? `<details${open ? " open" : ""}><summary>${esc(title)}</summary><pre class="txt">${esc(t)}</pre></details>` : "";
}

// tooltip: any element with data-tip shows it (plain text, \n = new line)
const tip = document.getElementById("tip");
function showTip(e, text) {
  tip.textContent = text; tip.style.display = "block";
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + w > innerWidth - 8) x = e.clientX - w - 14;
  if (y + h > innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (t) showTip(e, t.getAttribute("data-tip")); else if (!e.target.closest("[data-xhair]")) tip.style.display = "none";
});

// ---------- diverging colour (blue < 0 < red, neutral midpoint) ----------
function divStops() {
  const dark = css("--bg").toLowerCase() === "#121211";
  return dark ? ["#a9cdf7", "#3987e5", "#1d4a85", "#2e2d2a", "#8a2a28", "#e34948", "#f7b2ad"]
              : ["#104281", "#3987e5", "#cde2fb", "#f0efec", "#f9d3d1", "#e34948", "#8c1d1d"];
}
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function divColor(t, stops) {        // t in [-1, 1]
  const x = (Math.max(-1, Math.min(1, t)) + 1) / 2 * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;
  const a = hex2rgb(stops[i]), b = hex2rgb(stops[i + 1]);
  return `rgb(${a.map((v, k) => Math.round(v + (b[k] - v) * f)).join(",")})`;
}

// ---------- state / routing ----------
const S = {tab: "overview", audit: {q: "", seq: "", pool: false, page: 0}, controls: {model: null, cond: "", elig: true, q: "", page: 0},
           probes: {model: null, split: "", carrier: "", pos: "", q: "", set: null, cond: "e", full: false},
           runs: {name: null, measure: "d_es_far", head: null, mfield: "M_far", lfield: "far",
                  filt: {carrier: "", pos: "", seq: "", n: ""}}};
function setTab(t) { S.tab = t; location.hash = t; render(); }
window.addEventListener("hashchange", () => { const t = location.hash.slice(1); if (t && t !== S.tab && TABS.some(x => x[0] === t)) { S.tab = t; render(); } });
document.getElementById("theme").onclick = () => {
  const r = document.documentElement, cur = r.getAttribute("data-theme");
  const sysDark = matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", (cur ? cur === "dark" : sysDark) ? "light" : "dark");
  render();
};

function render() {
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) => `<a href="#${k}" class="${k === S.tab ? "on" : ""}">${l}</a>`).join("");
  const app = document.getElementById("app");
  tip.style.display = "none";
  ({overview: renderOverview, audit: renderAudit, controls: renderControls, probes: renderProbes,
    runs: renderRuns, tests: renderTests, figures: renderFigures})[S.tab](app);
}

// =====================================================================
// Overview
// =====================================================================
function renderOverview(app) {
  const A = D.audit, P = D.probes, R = D.runs;
  const nPy = A ? A.rows.filter(r => r.pythia410m).length : 0;
  const passed = (D.texts.pytest || "").match(/(\d+) passed/);
  const failed = (D.texts.pytest || "").match(/(\d+) failed/);
  const st = (ok, t) => `<span class="status ${ok === null ? "none" : ok ? "ok" : "bad"}">${ok === null ? "○" : ok ? "✓" : "!"} ${esc(t)}</span>`;
  const probeTags = Object.keys(P);
  const nSets = probeTags.map(t => `${D.display[t]}: ${P[t].sets.length} sets`).join(" · ");
  app.innerHTML = `
  <h2>What this page is</h2>
  <p class="lead">Everything the C2 code (tokenisation audit → controls → probes → metric → runs) has written to
  <code>outputs/c2/</code>, in one place. It is rebuilt by <code>python scripts/c2.py report</code>, and automatically
  after every <code>run</code> and <code>figures</code>, so whatever you test next appears here. Hover over any chart for exact values.</p>
  <h2>The question</h2>
  <p class="lead">Do the pieces an emoji is chopped into get <b>more attention</b> from later tokens than look-alike strings with
  the same number of pieces that are <b>not</b> emoji? Each emoji is compared, inside an identical sentence, with an English word,
  rare characters and a hex string that split into the same number of tokens.</p>
  <h2>The pipeline</h2>
  <div class="steps">
    <div class="step"><div class="num">STEP 1</div><h3>Tokenisation audit</h3>
      <p>Counts how many tokens every one of the Unicode emoji becomes in each model.</p>
      <p>${A ? st(true, `${A.rows.length} emoji · pool ${A.pool_n}`) : st(null, "not run: scripts/c2.py audit")}</p><a href="#audit">Open →</a></div>
    <div class="step"><div class="num">STEP 2</div><h3>Control fillers</h3>
      <p>Builds look-alike strings (words, rare characters, hex, punctuation, plain words) and counts their tokens.</p>
      <p>${D.controls ? st(true, Object.keys(D.controls.rows).map(t => D.display[t]).join(" + ")) : st(null, "not run: scripts/c2.py controls")}</p><a href="#controls">Open →</a></div>
    <div class="step"><div class="num">STEP 3</div><h3>Matched probes</h3>
      <p>Puts each emoji and its look-alikes into the same sentence at the same token position; rejects anything not perfectly matched.</p>
      <p>${probeTags.length ? st(true, nSets) : st(null, "not run: scripts/c2.py probes")}</p><a href="#probes">Open →</a></div>
    <div class="step"><div class="num">STEP 4</div><h3>Runs (the measurement)</h3>
      <p>Feeds probes through the model and measures M, the share of later tokens' attention that lands on the slot, for every head.</p>
      <p>${R.length ? st(true, `${R.length} run${R.length > 1 ? "s" : ""}: ` + R.map(r => `${r.model} ${r.split}`).join(", ")) : st(null, "not run: scripts/c2.py run")}</p><a href="#runs">Open →</a></div>
    <div class="step"><div class="num">STEP 5</div><h3>Tests and hand-check</h3>
      <p>Proves the attention is read correctly and the maths matches a hand calculation.</p>
      <p>${passed ? st(!failed, `${passed[1]} passed${failed ? `, ${failed[1]} failed` : ""}`) : st(null, "no saved pytest output")}</p><a href="#tests">Open →</a></div>
    <div class="step"><div class="num">STEP 6</div><h3>Figures</h3>
      <p>Static PNGs for slides (pilot figures carry the DEVELOPMENT PILOT label).</p>
      <p>${D.images.length ? st(true, `${D.images.length} images`) : st(null, "none yet")}</p><a href="#figures">Open →</a></div>
  </div>
  <h2>Words used on this page</h2>
  <div class="card"><dl class="gloss">
    <dt>token</dt><dd>A chunk of text the model reads. "cat" is 1 token; 👍🏽 is 6 tokens in Pythia.</dd>
    <dt>byte fragment</dt><dd>A token that is only part of a character's bytes, shown like <span class="chip frag">‹F0 9F›</span>. Meaningless on its own.</dd>
    <dt>slot (S)</dt><dd>The tokens of the thing being tested (emoji or control), always starting at token 24 or 96.</dd>
    <dt>buffer</dt><dd>The 16 tokens right after the slot. Not used for M_far, so nearby "reading the next word" attention doesn't count.</dd>
    <dt>Q (readers)</dt><dd>The 64 tokens after the buffer. M_far asks how much these look back at the slot. M_near uses the buffer instead.</dd>
    <dt>M</dt><dd>Average, over the readers, of the attention share that lands on the slot (0 = none, 1 = all).</dd>
    <dt>Δ (delta)</dt><dd>M for the emoji minus M for a look-alike in the same sentence. Positive = the emoji got more attention.</dd>
    <dt>layer / head</dt><dd>Pythia-410M has 24 layers × 16 heads = 384 separate attention mechanisms; each gets its own M.</dd>
    <dt>± SE</dt><dd>Standard error across <b>emoji</b> (not across sentences), because sentences sharing an emoji are not independent.</dd>
    <dt>dev / confirm</dt><dd>5 dev emoji are for testing the pipeline (pilot). 48 confirm emoji are the real experiment.</dd>
  </dl></div>`;
}

// =====================================================================
// 1 Audit
// =====================================================================
function renderAudit(app) {
  const A = D.audit;
  if (!A) { app.innerHTML = emptyBox("No audit yet. Run <code>python scripts/c2.py audit</code>, then <code>python scripts/c2.py report</code>."); return; }

function drawHistogram(el, A) {
  const tags = A.tags, maxN = Math.max(...A.rows.flatMap(r => tags.filter(t => r[t]).map(t => r[t][0])));
  const counts = tags.map(t => { const c = new Array(maxN + 1).fill(0); A.rows.forEach(r => { if (r[t]) c[r[t][0]]++; }); return c; });
  const W = Math.max(560, Math.min(el.clientWidth || 900, 1100)), Hh = 260, m = {l: 48, r: 10, t: 10, b: 34};
  const iw = W - m.l - m.r, ih = Hh - m.t - m.b, ymax = Math.max(...counts.flat());
  const ticks = niceTicks(0, ymax, 5), ytop = ticks[ticks.length - 1];
  const bw = iw / maxN, gw = Math.max(2, (bw - 4) / tags.length);
  const X = n => m.l + (n - 1) * bw, Y = v => m.t + ih - ih * v / ytop;
  let s = `<svg width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Histogram of tokens per emoji">`;
  s += `<rect x="${X(2)}" y="${m.t}" width="${bw * 5}" height="${ih}" fill="var(--chip)"/>`;
  ticks.forEach(t => { s += `<line class="gridl" x1="${m.l}" x2="${W - m.r}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${m.l - 6}" y="${Y(t) + 4}" text-anchor="end">${t}</text>`; });
  for (let n = 1; n <= maxN; n++) {
    tags.forEach((t, k) => {
      const v = counts[k][n]; if (!v) return;
      const x = X(n) + 2 + k * gw, y = Y(v), h = m.t + ih - y;
      s += `<path d="M${x},${m.t + ih}V${y + Math.min(3, h)}q0,-3 3,-3h${Math.max(0, gw - 7)}q3,0 3,3V${m.t + ih}Z" fill="var(--m-${t})"/>`;
    });
    const tipT = `${n} token${n > 1 ? "s" : ""}\n` + tags.map((t, k) => `${D.display[t]}: ${counts[k][n]} emoji`).join("\n");
    s += `<rect x="${X(n)}" y="${m.t}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(tipT)}"/>`;
    if (maxN <= 30 || n % 2 === 1) s += `<text x="${X(n) + bw / 2}" y="${Hh - m.b + 16}" text-anchor="middle">${n}</text>`;
  }
  s += `<line class="axis" x1="${m.l}" x2="${W - m.r}" y1="${m.t + ih}" y2="${m.t + ih}"/>`;
  s += `<text x="${m.l + iw / 2}" y="${Hh - 4}" text-anchor="middle">tokens per emoji (probe-slot context)</text>`;
  s += `<text transform="translate(12,${m.t + ih / 2}) rotate(-90)" text-anchor="middle">number of emoji</text></svg>`;
  el.innerHTML = s;
}

function loadRun(name, cb) {
  if (window.C2_RUN[name]) return cb(window.C2_RUN[name]);
  const meta = D.runs.find(r => r.name === name), sc = document.createElement("script");
  sc.src = meta.file; sc.charset = "utf-8";
  sc.onload = () => cb(prepRun(window.C2_RUN[name]));
  sc.onerror = () => { document.getElementById("rbody").innerHTML = emptyBox(`Could not load ${esc(meta.file)}. Rebuild with <code>python scripts/c2.py report</code>.`); };
  document.head.appendChild(sc);
}
function prepRun(r) {
  if (r._prep) return r;
  for (const k in r.measures) { r.measures[k].E = f32(r.measures[k].by_emoji); r.measures[k].LS = f32(r.measures[k].layer_sets); }
  for (const f in r.cond) for (const c in r.cond[f]) {
    r.cond[f][c].E = f32(r.cond[f][c].by_emoji);
    if (r.cond[f][c].layer_sets) r.cond[f][c].LS = f32(r.cond[f][c].layer_sets);
  }
  r._prep = true; return r;
}
function headStats(r, E) {          // E: [nE, L, H] -> per-head mean, SE, #emoji > 0
  const nE = r.emoji.length, K = r.L * r.H, out = {m: new Float32Array(K), se: new Float32Array(K), pos: new Uint16Array(K), n: new Uint16Array(K)};
  for (let k = 0; k < K; k++) {
    const v = []; for (let e = 0; e < nE; e++) v.push(E[e * K + k]);
    const ms = meanSE(v); out.m[k] = ms.m; out.se[k] = ms.se; out.n[k] = ms.n; out.pos[k] = v.filter(x => x > 0).length;
  }
  return out;
}
function setMask(r) {
  const f = S.runs.filt, s = r.sets;
  return s.emoji.map((_, i) => (!f.carrier || s.carrier[i] === f.carrier) && (!f.pos || s.pos[i] === f.pos) && (!f.seq || s.seq[i] === f.seq) && (!f.n || String(s.n[i]) === f.n));

    <div style="flex:1;min-width:260px"><h3>most negative (emoji gets less)</h3><table>${head}<tbody>${idx.slice(-8).reverse().map(row).join("")}</tbody></table></div></div>`;
  document.querySelectorAll("#rtop tr[data-k]").forEach(tr => tr.onclick = () => { st.head = +tr.dataset.k; runHeat(r); document.getElementById("rheat").scrollIntoView({behavior: "smooth", block: "center"}); });
}

// =====================================================================
// 5 Tests, 6 Figures
// =====================================================================
function renderTests(app) {
  const t = D.texts, passed = (t.pytest || "").match(/(\d+) passed/), failed = (t.pytest || "").match(/(\d+) failed/);
  const lines = (t.pytest || "").split("\n").filter(x => /PASSED|FAILED|SKIPPED|ERROR/.test(x));
  const groups = {};
  lines.forEach(x => { const f = x.split("::")[0]; (groups[f] = groups[f] || []).push(x); });
  app.innerHTML = `<h2>Tests and the hand-check</h2>
    <p class="lead">These prove the measurement is wired correctly before any number is trusted: attention rows add to 1, nothing looks
    at future tokens, the fast streaming code gives the same M as the full attention matrix, the probe rules reject bad matches,
    and M computed by hand on a real sentence equals the code's M. Re-save after running tests with
    <code>pytest -v tests | tee outputs/c2/tests/pytest_output.txt</code>.</p>
    <div class="grid"><div class="tile"><div class="k">pytest</div><div class="v">${passed ? `${passed[1]} passed` : "–"}</div><div class="n">${failed ? `${failed[1]} failed` : passed ? "0 failed" : "no saved output"}</div></div>
    ${Object.entries(groups).map(([f, xs]) => `<div class="tile"><div class="k">${esc(f.replace("tests/", ""))}</div><div class="v" style="font-size:18px">${xs.filter(x => x.includes("PASSED")).length} / ${xs.length}</div><div class="n">passed</div></div>`).join("")}</div>
    ${t.handcheck ? `<h2>Hand-check: M by hand = M from code</h2><pre class="txt">${esc(t.handcheck)}</pre>` : emptyBox("No hand-check saved. Run <code>python scripts/c2.py handcheck</code>.")}
    ${txtBlock("Full pytest output", t.pytest)}`;
}
function renderFigures(app) {
  if (!D.images.length) { app.innerHTML = emptyBox("No figures yet."); return; }
  const caps = {audit_token_hist: "Tokens per emoji, both models (audit)", chopped_examples: "How example strings get chopped (orange = byte fragment)",
    anatomy: "One matched set: only the slot differs", heatmap_d_es_far: "Δ_es per head (emoji − rare chars)", heatmap_d_ew_far: "Δ_ew per head (emoji − English word)",
    layers_delta: "Δ by layer, ±1 SE across emoji", positive_control: "Positive control: punctuation vs ordinary word"};
  const sec = uniq(D.images.map(i => i.section));
  app.innerHTML = `<h2>Saved figures (PNG, for slides)</h2>
    <p class="lead">These are the static images in <code>outputs/c2/</code>. Pilot figures are titled <b>${esc(D.pilot_label)}</b> and show n.
    Click an image to open it full size.</p>
    ${sec.map(s => `<h3>${esc(s)}</h3><div class="gallery">${D.images.filter(i => i.section === s).map(i => {
      const key = Object.keys(caps).find(k => i.name.startsWith(k));
      return `<figure><a href="${esc(i.src)}" target="_blank"><img src="${esc(i.src)}" alt="${esc(i.name)}" loading="lazy"></a><figcaption><b>${esc(key ? caps[key] : i.name)}</b><br>${esc(i.src.replace("../", "outputs/c2/"))}</figcaption></figure>`; }).join("")}</div>`).join("")}`;
}

// ---------- boot ----------
document.getElementById("gen").textContent = D ? `built ${D.generated.replace("T", " ")} from outputs/c2/` : "";
if (!D) document.getElementById("app").innerHTML = emptyBox("data/base.js is missing. Run <code>python scripts/c2.py report</code>.");
else { const t = location.hash.slice(1); if (TABS.some(x => x[0] === t)) S.tab = t; render(); }
</script>
