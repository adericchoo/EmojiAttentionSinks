  selection_rules:
  - A has 12 single-codepoint entries in each of the five declared supplementary-plane ranges, in fixed
    candidate order.
  - B screens fixed BMP-symbol candidates in three codepoint ranges; keep E2-leading entries with at least
    two actual Pythia tokens, taking the declared quota per range.
  - C has eight skin-tone sequences, six ZWJ/family sequences, and six regional-indicator flags; expected
    F0 9F count follows supplementary-plane codepoints.
  - D screens the fixed E2 symbol candidate pool and keeps the first 15 single-token, round-trip entries.
  - A expected token counts are three; B uses the UTF-8 byte-split expectation with FE0F expected as two
    tokens; C uses three tokens per scalar except ZWJ and FE0F, which are expected as two; D expects one
    whole token.
  - Each A stimulus receives deterministic hex and rare-character controls matched to its token count
    across all three fragment-matched carrier templates.
  - The 15 glosses are a fixed subset of A and use one-word meanings.
  - Any decode round-trip failure or unlocatable span is dropped; expected/actual lead or fragment-count
    differences are retained and flagged.
